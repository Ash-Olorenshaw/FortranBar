name = "FortranBar"
version = "0.1.0"
license = "license"
author = "Ash Olorenshaw"
maintainer = "asholorenshaw@gmail.com"
copyright = "Copyright 2026, Ash Olorenshaw"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["gtk4-layer-shell"]

[install]
library = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
stdlib = "*"
gtk-fortran = { git = "https://github.com/vmagnin/gtk-fortran.git", branch = "gtk4" }

